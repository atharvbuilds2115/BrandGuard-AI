services:
  - type: web
    name: brandguard-ai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: brandguard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:////var/data/brandguard.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-admin.json
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_ACCOUNT_EMAIL
        sync: false
      - key: DEMO_CREATOR_EMAIL
        sync: false
      - key: DEMO_CREATOR_PASSWORD
        sync: false
      - key: DEMO_REVIEWER_EMAIL
        sync: false
      - key: DEMO_REVIEWER_PASSWORD
        sync: false
      - key: DEMO_AGENCY_EMAIL
        sync: false
      - key: DEMO_AGENCY_PASSWORD
        sync: false
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
